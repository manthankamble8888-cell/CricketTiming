<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Timing Helper</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
        }

        .container {
            padding: 30px 20px;
        }

        h1 {
            font-size: 30px;
        }

        .card {
            background: #1f2937;
            border-radius: 20px;
            padding: 25px;
            margin-top: 25px;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 15px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            background: #22c55e;
            color: white;
        }

        button:active {
            transform: scale(0.98);
        }

        #result {
            margin-top: 25px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🏏 Cricket Timing Helper</h1>

    <div class="card">

        <p>Ball timing assistant</p>

        <button onclick="startTimer()">
            START
        </button>

        <button onclick="stopTimer()">
            STOP
        </button>

        <div id="result">
            Ready
        </div>

    </div>

</div>

<script>

let startTime = 0;

function startTimer() {
    startTime = performance.now();
    document.getElementById("result").innerText = "Timing...";
}

function stopTimer() {
    if (startTime === 0) {
        document.getElementById("result").innerText = "Start first";
        return;
    }

    let elapsed = performance.now() - startTime;

    document.getElementById("result").innerText =
        "Time: " + (elapsed / 1000).toFixed(3) + " sec";

    startTime = 0;
}

</script>

</body>
</html>
